# Test, then build and push the review page image to GHCR (ghcr.io/<owner>/farhangbench-review).
# Tags: latest and sha-<commit> from the default branch, and the version from v* tags.
name: review-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "farhang/**"
      - "data/**"
      - "config/**"
      - "schema/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/review-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m farhang validate
      - run: python -m unittest discover -s tests -t .

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/farhangbench-review
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
