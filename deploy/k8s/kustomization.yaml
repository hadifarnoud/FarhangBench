# FarhangBench review page. Build with:  kubectl apply -k deploy/k8s
# Before the first apply: create deploy/k8s/users (see deploy/README.md), and set your host and image below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: farhangbench
labels:
  - pairs:
      app.kubernetes.io/part-of: farhangbench

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  - name: farhangbench-review
    newName: ghcr.io/hadifarnoud/farhangbench-review
    newTag: latest  # pin to a commit tag (sha-xxxxxxx) for reproducible deploys

# Admin accounts: one "name:hash" line each, from `python -m farhang review-user NAME`. Admins add reviewers in
# the page's People tab (stored on the volume). The file is gitignored; editing it rolls the pod.
secretGenerator:
  - name: farhangbench-review-users
    files:
      - users

patches:
  - target:
      kind: Ingress
      name: farhangbench-review
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: review.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: review.example.com
