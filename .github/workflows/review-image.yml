# Test, then build and push the review page image to GHCR (ghcr.io/<owner>/farhangbench-review).
# Tags: latest and sha-<commit> from the default branch, and the version from v* tags.
name: review-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "farhang/**"
      - "data/**"
      - "config/**"
      - "schema/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/review-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install hazm==0.12.1  # so the lemma-matching tests run against the real library
      - run: python -m farhang validate
      - run: python -m unittest discover -s tests -t .

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/farhangbench-review
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After a green build on the default branch, tell Coolify to pull the new image and redeploy.
  # Add COOLIFY_WEBHOOK (the resource's Deploy Webhook URL) and COOLIFY_TOKEN (an API token with the
  # deploy permission) under Settings > Secrets; without them this job prints a notice and does nothing.
  deploy:
    needs: image
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Trigger the Coolify redeploy
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK/COOLIFY_TOKEN not set; skipping the Coolify redeploy."
            exit 0
          fi
          curl -fsS --retry 3 -X GET "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
